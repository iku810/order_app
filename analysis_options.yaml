# `flutter analyze`を実行したときの静的解析のルールを定義するファイル

# Flutterプロジェクトで推奨されるLintルールを有効にする
include: package:flutter_lints/flutter.yaml

analyzer:
  # 静的解析の対象から外すファイル（自動生成ファイルなど）
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

  # 型安全に関するルールを有効にする
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  # 特定のルールの重大度を変更する
  errors:
    todo: ignore
    unused_local_variable: error
    invalid_annotation_target: ignore
    unused_import: error
    parameter_assignments: error

linter:
  # Lintルールを追加する
  rules:
    # 型安全・不変性
    - always_declare_return_types # 戻り値の型を明示
    - prefer_final_locals # 再代入しない変数をfinal
    - prefer_const_declarations # 不変変数をconst
    - prefer_const_literals_to_create_immutables # リテラルをconst作成

    # パフォーマンス最適化
    - prefer_const_constructors # constコンストラクタを使用

    # 非同期・リソース管理
    - unawaited_futures # await忘れを検出
    - cancel_subscriptions # Stream購読をキャンセル
    - close_sinks # Sinkを閉じる

    # コードスタイル・可読性
    - directives_ordering # importの順序を統一
    - require_trailing_commas # 末尾カンマを要求
    - prefer_single_quotes # シングルクォート優先
    - prefer_interpolation_to_compose_strings # 文字列補間を使用
    - cascade_invocations # カスケード演算子を使用
    - sort_constructors_first # コンストラクタを先に配置
    - always_put_required_named_parameters_first # 必須パラメータを先に配置
    - prefer_relative_imports # 相対インポートを優先
    - cast_nullable_to_non_nullable # null安全でのキャストを許可

    # Flutter UI関連ルール
    - sort_child_properties_last # childプロパティを最後に配置
    - avoid_unnecessary_containers # 不要なContainerを避ける

    # プロジェクト管理・デバッグ
    - sort_pub_dependencies # 依存パッケージをソート
    - avoid_print # printを使用しない