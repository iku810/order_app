name: order_app
description: "A new Flutter project."
# `flutter pub publish` を使ってパッケージが pub.dev に誤って公開されるのを防ぐ
publish_to: "none" 

# アプリのバージョンとビルド番号を指定する（例: 1.2.43+5）
# 各プラットフォームで build-name/build-number に対応する
version: 1.0.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"

# 依存関係: このパッケージが動作するために必要な他のパッケージを指定する
dependencies:
  cupertino_icons: ^1.0.6
  flutter:
    sdk: flutter

# 開発依存関係: このパッケージの開発やテストに必要なパッケージを指定する
dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

# 以下は Flutter パッケージ固有のセクション
flutter:
  # Material Icons フォント・material Icons クラスのアイコンを使用可能にする
  uses-material-design: true

  # アセット追加例:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # 解像度ごとの画像バリアント対応。詳細: https://flutter.dev/assets-and-images/#resolution-aware

  # パッケージ依存アセット追加例: https://flutter.dev/assets-and-images/#from-packages

  # カスタムフォント追加例:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

  # パッケージ依存フォント追加例: https://flutter.dev/custom-fonts/#from-packages
