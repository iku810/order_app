name: order_app
description: "A new Flutter project."
# `flutter pub publish` を使ってパッケージが pub.dev に誤って公開されるのを防ぐ
publish_to: "none"

# アプリのバージョンとビルド番号を指定する（例: 1.2.43+5）
# 各プラットフォームで build-name/build-number に対応する
version: 1.0.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"

# 依存関係: このパッケージが動作するために必要な他のパッケージを指定する
dependencies:
  cupertino_icons: ^1.0.6
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  freezed_annotation: ^3.1.0
  go_router: ^17.1.0
  hooks_riverpod: ^3.2.1
  http: ^1.6.0
  json_annotation: ^4.11.0
  retrofit: ^4.9.2
  riverpod_annotation: ^4.0.2

# 開発依存関係: このパッケージの開発やテストに必要なパッケージを指定する
dev_dependencies:
  build_runner: ^2.12.2
  build_verify: ^3.1.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  go_router_builder: ^4.2.0
  json_serializable: ^6.13.0
  retrofit_generator: ^10.2.1
  riverpod_generator: ^4.0.3

# 以下は Flutter パッケージ固有のセクション
flutter:
  # Material Icons フォント・material Icons クラスのアイコンを使用可能にする
  uses-material-design: true

  # アセット追加例:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # 解像度ごとの画像バリアント対応。詳細: https://flutter.dev/assets-and-images/#resolution-aware

  # パッケージ依存アセット追加例: https://flutter.dev/assets-and-images/#from-packages

  # カスタムフォント追加例:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

  # パッケージ依存フォント追加例: https://flutter.dev/custom-fonts/#from-packages
